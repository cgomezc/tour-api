# =============================================================================
# CJTour Azure DevOps Pipeline - Ubuntu Linux 22.04
# =============================================================================
# This pipeline builds and deploys the CJTour .NET application on Ubuntu Linux
# 
# Features:
# - Ubuntu 22.04 LTS agents
# - Build with caching for faster builds
# - Automated testing
# - Linux-optimized deployment
# - Health checks and monitoring
# - Configurable cleanup and maintenance
# =============================================================================

trigger:
  branches:
    include:
    - main

pr:
  branches:
    include:
    - main

pool:
  name: az-linux

variables:
  buildConfiguration: 'Release'
  outputFolder: 'publish_output'

steps:
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '9.0.x'
    installationPath: $(Agent.ToolsDirectory)/dotnet

- script: |
    dotnet restore
  displayName: 'Restore packages'

- script: |
    dotnet build --configuration $(buildConfiguration)
  displayName: 'Build project'

- script: |
    dotnet publish --configuration $(buildConfiguration) --output $(outputFolder)
  displayName: 'Publish app'

# Aquí podrías copiar a una ruta especial o reiniciar algún servicio
- script: |
    sudo systemctl stop cj-api.service
    sudo mkdir -p /home/azureuser/myapp/
    sudo cp -r $(outputFolder)/* /home/azureuser/myapp/
    sudo systemctl start cj-api.service
  displayName: 'Deploy to VM service'